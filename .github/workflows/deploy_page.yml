name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm 并使用缓存安装包
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install
      - name: Build
        run: pnpm build-only --mode github-page

      # 可选: 用仓库 Secret(PAGE_PASSWORD) 给站点加密。未配置则跳过, 页面公开。
      - name: Encrypt site with password
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          if [ -z "$PAGE_PASSWORD" ]; then
            echo "::notice::未配置 PAGE_PASSWORD, 跳过加密 (页面公开访问)"
            exit 0
          fi
          npx -y staticrypt@3 dist/index.html -p "$PAGE_PASSWORD" -d dist --short             --template-title "身份证生成器 · 需要访问密码"             --template-instructions "本站已加密保护，请输入访问密码"             --template-button "进入"             --template-placeholder "请输入访问密码"             --template-error "密码错误，请重新输入"             --template-remember "记住我（7天）"
          echo "::notice::已用 PAGE_PASSWORD 加密 index.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
